[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckwm"
version = "0.1.0"
description = "Client library for duckwm: binds, rules and arrangers over its socket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["protobuf>=5"]
license = "MIT"

[tool.hatch.build.targets.wheel]
packages = ["src/duckwm"]
